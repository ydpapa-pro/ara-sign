<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인천아라고 디지털 서명부 이동 중</title>
  <script>
    // authuser=0을 명시하여 멀티 계정 세션 충돌(/u/1/) 방지
    var rawUrl = "https://script.google.com/macros/s/AKfycbxnDuTB6Vp1YMoLpCnJKlmmHL4DO661m5G694QEaDCOQRMFcfD5P1hlYvMHNLPTHQ8lBw/exec?authuser=0";
    
    window.onload = function() {
      var userAgent = navigator.userAgent.toLowerCase();
      
      // 안드로이드 환경: 네이버/카카오 인앱 브라우저를 탈출하여 외부 Chrome 앱 실행
      if (userAgent.indexOf('android') !== -1) {
        var cleanUrl = rawUrl.replace(/^https?:\/\//i, '');
        var intentUrl = 'intent://' + cleanUrl + '#Intent;scheme=https;package=com.android.chrome;end';
        location.href = intentUrl;
      } 
      // iOS(아이폰) 및 기타 환경: 일반 리다이렉트
      else {
        location.href = rawUrl;
      }
    };
  </script>
</head>
<body>
  <div style="text-align:center; padding-top:50px; font-family:sans-serif;">
    <p>서명부 페이지로 이동 중입니다...</p>
    <p><a href="https://script.google.com/macros/s/AKfycbxnDuTB6Vp1YMoLpCnJKlmmHL4DO661m5G694QEaDCOQRMFcfD5P1hlYvMHNLPTHQ8lBw/exec?authuser=0">자동으로 이동하지 않으면 여기를 클릭하세요.</a></p>
  </div>
</body>
</html>
