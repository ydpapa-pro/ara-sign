<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>인천아라고 디지털 서명부</title>
  <script>
    // ?authuser=0 구문을 추가하여 다중 구글 계정 세션 충돌(/u/1/)을 강제로 방지
    var gasUrl = "https://script.google.com/macros/s/AKfycbxnDuTB6Vp1YMoLpCnJKlmmHL4DO661m5G694QEaDCOQRMFcfD5P1hlYvMHNLPTHQ8lBw/exec";
    
    function openExternal() {
      var userAgent = navigator.userAgent.toLowerCase();
      
      // 안드로이드: Chrome 앱으로 강제 전환
      if (userAgent.indexOf('android') !== -1) {
        var intentUrl = 'intent://' + gasUrl.replace(/https?:\/\//i, '') + '#Intent;scheme=https;package=com.android.chrome;end';
        location.href = intentUrl;
      } 
      // 아이폰(iOS) 및 기타: 일반 이동
      else {
        location.href = gasUrl;
      }
    }

    // 페이지 진입 즉시 실행
  //  window.addEventListener('DOMContentLoaded', function() {
  //    openExternal();
  //  }
                           );
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Malgun Gothic', sans-serif;
      background-color: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }
    .card {
      width: 90%;
      max-width: 380px;
      background: white;
      padding: 35px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      box-sizing: border-box;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
      color: #0066b2;
      margin-bottom: 12px;
    }
    .desc {
      font-size: 15px;
      color: #555;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px 0;
      background-color: #0066b2;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 102, 178, 0.25);
      box-sizing: border-box;
    }
    .btn:active {
      background-color: #004d85;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">인천아라고 디지털 서명부</div>
    <div class="desc">서명부 페이지로 이동 중입니다.<br>화면이 멈춰있으면 아래 버튼을 눌러주세요.</div>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbxnDuTB6Vp1YMoLpCnJKlmmHL4DO661m5G694QEaDCOQRMFcfD5P1hlYvMHNLPTHQ8lBw/exec">
      ✍️ 서명 작성하러 가기
    </a>
  </div>
</body>
</html>
