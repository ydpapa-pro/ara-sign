<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인천아라고 디지털 서명부 이동 중</title>
  <script>
    // 최종 구글 웹앱 주소
    var gasUrl = "https://script.google.com/macros/s/AKfycbxnDuTB6Vp1YMoLpCnJKlmmHL4DO661m5G694QEaDCOQRMFcfD5P1hlYvMHNLPTHQ8lBw/exec";
    
    window.onload = function() {
      var userAgent = navigator.userAgent.toLowerCase();
      
      // 안드로이드 계열 (네이버/카카오/기본 QR 스캐너 포함) -> 크롬 브라우저 강제 호출
      if (userAgent.indexOf('android') !== -1) {
        var intentUrl = 'intent://' + gasUrl.replace(/https?:\/\//i, '') + '#Intent;scheme=https;package=com.android.chrome;end';
        location.href = intentUrl;
      } 
      // 아이폰(iOS) -> 일반 리다이렉트
      else {
        location.href = gasUrl;
      }
    };
  </script>
  <style>
    body {
      font-family: 'Malgun Gothic', sans-serif;
      text-align: center;
      padding-top: 100px;
      background-color: #f5f7fa;
      color: #333;
    }
    .loader {
      font-size: 18px;
      font-weight: bold;
    }
    .btn-link {
      margin-top: 20px;
      display: inline-block;
      padding: 12px 24px;
      background-color: #0066b2;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="loader">⏳ 서명부 페이지로 이동 중입니다...</div>
  <p style="font-size:14px; color:#666; margin-top:10px;">자동으로 이동하지 않으면 아래 버튼을 눌러주세요.</p>
  <a id="directBtn" class="btn-link" href="https://script.google.com/macros/s/AKfycbxnDuTB6Vp1YMoLpCnJKlmmHL4DO661m5G694QEaDCOQRMFcfD5P1hlYvMHNLPTHQ8lBw/exec">서명부 바로가기</a>
</body>
</html>
